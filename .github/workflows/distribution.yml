name: Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - id: metadata
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "rhythm-map-dist"))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          fi

  native:
    needs: identity
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target" >> "${GITHUB_ENV}"
      - id: host
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
      - shell: bash
        run: cargo build --locked --release --target "${{ steps.host.outputs.target }}" -p rhythm-map-cli -p rhythm-map-ffi
      - id: package
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          TARGET: ${{ steps.host.outputs.target }}
        run: |
          name="rhythm-map-native-${VERSION}-${TARGET}"
          directory="${RUNNER_TEMP}/${name}"
          cargo run --locked -p rhythm-map-dist -- native \
            --input-dir "${CARGO_TARGET_DIR}/${TARGET}/release" \
            --output-dir "${directory}" \
            --target "${TARGET}" \
            --git-commit "${GITHUB_SHA}"
          python "${directory}/verify_package.py" "${directory}"
          "${directory}/bin/rhythm-map$(if [[ "${TARGET}" == *windows* ]]; then printf '.exe'; fi)" --version
          library="${directory}/lib/librhythm_map_ffi.so"
          if [[ "${TARGET}" == *windows* ]]; then library="${directory}/lib/rhythm_map_ffi.dll"; fi
          if [[ "${TARGET}" == *apple* ]]; then library="${directory}/lib/librhythm_map_ffi.dylib"; fi
          python examples/03-c-ffi/python/analyze_wav.py --library "${library}" --abi-only
          if [[ "${TARGET}" == *windows* ]]; then
            archive="${RUNNER_TEMP}/${name}.zip"
            tar -a -cf "${archive}" -C "${RUNNER_TEMP}" "${name}"
          else
            archive="${RUNNER_TEMP}/${name}.tar.gz"
            tar -czf "${archive}" -C "${RUNNER_TEMP}" "${name}"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  wasm:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target" >> "${GITHUB_ENV}"
      - id: wasm-bindgen
        shell: bash
        run: |
          version="$(cargo metadata --locked --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "wasm-bindgen"))')"
          cargo install wasm-bindgen-cli --version "${version}" --locked
      - shell: bash
        run: cargo build --locked --release --target wasm32-unknown-unknown -p rhythm-map-wasm
      - id: package
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          generated="${RUNNER_TEMP}/wasm-bindgen"
          wasm-bindgen \
            --target web \
            --out-dir "${generated}" \
            --out-name rhythm_map \
            "${CARGO_TARGET_DIR}/wasm32-unknown-unknown/release/rhythm_map_wasm.wasm"
          name="rhythm-map-browser-wasm-${VERSION}-wasm32-unknown-unknown"
          directory="${RUNNER_TEMP}/${name}"
          cargo run --locked -p rhythm-map-dist -- wasm \
            --input-dir "${generated}" \
            --output-dir "${directory}" \
            --target wasm32-unknown-unknown \
            --git-commit "${GITHUB_SHA}"
          python "${directory}/verify_package.py" "${directory}"
          npm run smoke --prefix "${directory}"
          archive="${RUNNER_TEMP}/${name}.tar.gz"
          tar -czf "${archive}" -C "${RUNNER_TEMP}" "${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [identity, native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: rhythm-map-*
          path: release-assets
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Rhythm Map ${GITHUB_REF_NAME}"
